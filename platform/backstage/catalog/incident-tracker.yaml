apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: incident-tracker
  title: Incident Tracker
  description: Pulseboard incident operations app and reference service for PR previews.
  annotations:
    github.com/project-slug: YASHMAHAKAL/crossplane-preview-platform
    backstage.io/kubernetes-label-selector: preview.platform.example.org/service=incident-tracker
    backstage.io/kubernetes-cluster: kind-preview-platform
  tags: [incidents, preview, crossplane]
  links:
    - title: PR previews
      url: http://localhost:3000/previews
    - title: Propose a source change
      url: http://localhost:3000/create
    - title: Local cluster resources
      url: http://localhost:3000/catalog/default/component/incident-tracker/kubernetes
    - title: Deployment preview contract
      url: https://github.com/YASHMAHAKAL/crossplane-preview-platform/blob/main/docs/deployment-preview.md
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  dependsOn: [resource:default/kind-preview-platform]
