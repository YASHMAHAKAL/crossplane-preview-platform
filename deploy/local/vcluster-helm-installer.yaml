# Apply only in an evaluator-created vCluster preview namespace. This Role is
# deliberately namespaced; the provider receives no additional host-wide RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-helm-installer
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "pods", "pods/attach", "pods/portforward", "pods/exec", "pods/status", "pods/ephemeralcontainers", "pods/resize", "pods/log", "persistentvolumeclaims", "endpoints", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-helm-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-helm-installer
subjects:
  - kind: ServiceAccount
    name: preview-provider-helm
    namespace: crossplane-system
