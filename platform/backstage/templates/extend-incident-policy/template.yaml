apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: extend-incident-policy
  title: Add critical IncidentPolicy severity
  description: Propose the supported CRD schema change that adds critical severity, then open a source PR.
  tags: [incident-tracker, kubernetes, source-change]
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: IncidentPolicy schema change
      required: [changeId]
      properties:
        changeId:
          title: Change ID
          description: Unique short ID for this PR. Reuse it to update the same PR.
          type: string
          pattern: '^[a-z][a-z0-9-]{2,24}$'
  steps:
    - id: source
      name: Write supported CRD schema file
      action: fetch:plain
      input:
        url: ./skeleton
    - id: pullRequest
      name: Open or update source PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=YASHMAHAKAL&repo=crossplane-preview-platform
        branchName: backstage/incident-policy-${{ parameters.changeId }}
        targetBranchName: main
        title: 'IncidentPolicy schema: ${{ parameters.changeId }}'
        description: 'Bounded IncidentPolicy schema change from Backstage. The Go evaluator chooses the preview from the actual PR diff.'
        update: true
  output:
    links:
      - title: Source PR
        url: ${{ steps.pullRequest.output.remoteUrl }}
      - title: Track PR preview
        url: /previews?prUrl=${{ steps.pullRequest.output.remoteUrl }}
