apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: previewenvironments.preview.platform.example.org
spec:
  scope: Cluster
  group: preview.platform.example.org
  names:
    kind: PreviewEnvironment
    plural: previewenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [serviceRef, pr, image, request, preview, decision]
              properties:
                serviceRef:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,35}$'
                pr:
                  type: object
                  required: [number, headSHA]
                  properties:
                    number: {type: integer, minimum: 1}
                    headSHA: {type: string, pattern: '^[a-f0-9]{40}$'}
                image:
                  type: object
                  required: [digest]
                  properties:
                    digest: {type: string, pattern: '^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'}
                request:
                  type: object
                  required: [size, ttlMinutes]
                  properties:
                    size: {type: string, enum: [small, medium]}
                    ttlMinutes: {type: integer, minimum: 5, maximum: 240}
                preview:
                  type: object
                  required: [host]
                  properties:
                    host: {type: string, pattern: '^[a-z0-9-]+\.localhost$'}
                decision:
                  type: object
                  required: [mode, reasonCodes]
                  properties:
                    mode: {type: string, enum: [namespace, vcluster]}
                    reasonCodes:
                      type: array
                      items: {type: string}
                capabilities:
                  type: array
                  items: {type: string, enum: [incident-policy]}
