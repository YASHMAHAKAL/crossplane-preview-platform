name: Preview image
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Incident Tracker
        run: npm test
        working-directory: app/incident-tracker
      - name: Normalize image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable preview image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: app/incident-tracker
          file: app/incident-tracker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
          provenance: false
      - name: Record exact artifact and source head
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          record = {
              "headSHA": os.environ["HEAD_SHA"],
              "imageDigest": f'ghcr.io/{os.environ["IMAGE_REPOSITORY"]}@{os.environ["IMAGE_DIGEST"]}',
          }
          with open('preview-ci.json', 'w', encoding='utf-8') as output:
              json.dump(record, output)
              output.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-ci-${{ github.sha }}
          path: preview-ci.json
          if-no-files-found: error
