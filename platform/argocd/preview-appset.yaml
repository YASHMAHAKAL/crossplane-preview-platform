# Watch only the separate evaluator-owned GitOps repository. Never point this
# ApplicationSet at a source PR branch.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: preview-environments
  namespace: argocd
spec:
  description: Evaluator-owned PreviewEnvironment XRs and fixed vCluster installer grants
  sourceRepos:
    - git@github.com:YASHMAHAKAL/preview-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: incident-tracker-pr-*
  clusterResourceWhitelist:
    - group: preview.platform.example.org
      kind: PreviewEnvironment
  namespaceResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: git@github.com:YASHMAHAKAL/preview-gitops.git
        revision: main
        directories:
          - path: previews/*
  template:
    metadata:
      name: 'preview-{{.path.basename}}'
    spec:
      project: preview-environments
      source:
        repoURL: git@github.com:YASHMAHAKAL/preview-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
        directory:
          include: '*.json'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 30s
        syncOptions:
          - PrunePropagationPolicy=foreground
