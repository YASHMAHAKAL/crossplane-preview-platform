apiVersion: v1
kind: Namespace
metadata:
  name: pulseboard-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseboard
  namespace: pulseboard-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulseboard
  template:
    metadata:
      labels:
        app: pulseboard
    spec:
      containers:
        - name: pulseboard
          image: pulseboard:smoke
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulseboard
  namespace: pulseboard-smoke
spec:
  selector:
    app: pulseboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseboard
  namespace: pulseboard-smoke
spec:
  ingressClassName: nginx
  rules:
    - host: pulseboard-smoke.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseboard
                port:
                  name: http
