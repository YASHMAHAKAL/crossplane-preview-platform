apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tune-incident-tracker-deployment
  title: Tune Incident Tracker deployment
  description: Change bounded replicas and resource settings, then open a source PR.
  tags: [incident-tracker, deployment, source-change]
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Deployment settings change
      required: [changeId, replicas, requestCpu, requestMemory, limitCpu, limitMemory]
      properties:
        changeId:
          title: Change ID
          description: Unique short ID for this PR. Reuse it to update the same PR.
          type: string
          pattern: '^[a-z][a-z0-9-]{2,24}$'
        replicas:
          title: Replicas
          type: integer
          enum: [1, 2]
          default: 2
        requestCpu:
          title: CPU request
          type: string
          enum: [100m, 250m]
          default: 100m
        requestMemory:
          title: Memory request
          type: string
          enum: [128Mi, 256Mi]
          default: 128Mi
        limitCpu:
          title: CPU limit
          type: string
          enum: [500m, 1000m]
          default: 500m
        limitMemory:
          title: Memory limit
          type: string
          enum: [512Mi, 1024Mi]
          default: 512Mi
  steps:
    - id: source
      name: Write deployment settings file
      action: fetch:template
      input:
        url: ./skeleton
        values:
          replicas: ${{ parameters.replicas }}
          requestCpu: ${{ parameters.requestCpu }}
          requestMemory: ${{ parameters.requestMemory }}
          limitCpu: ${{ parameters.limitCpu }}
          limitMemory: ${{ parameters.limitMemory }}
    - id: pullRequest
      name: Open or update source PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=YASHMAHAKAL&repo=crossplane-preview-platform
        branchName: backstage/deployment-${{ parameters.changeId }}
        targetBranchName: main
        title: 'Deployment settings: ${{ parameters.changeId }}'
        description: 'Bounded Incident Tracker deployment change from Backstage. The Go evaluator chooses the preview from the actual PR diff.'
        update: true
  output:
    links:
      - title: Source PR
        url: ${{ steps.pullRequest.output.remoteUrl }}
      - title: Track PR preview
        url: /previews?prUrl=${{ steps.pullRequest.output.remoteUrl }}
